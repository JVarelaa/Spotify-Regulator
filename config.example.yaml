# Copia este fichero a config.yaml y ajústalo. Los secretos van en .env, no aquí.

# Zona horaria para "el día" de los límites y para mostrar fechas.
timezone: Atlantic/Canary

# Dónde se guardan el token y (en la fase 2) la base de datos SQLite.
# En Docker lo sobrescribe REGULATOR_DATA_DIR=/data.
data_dir: ./data

log_level: INFO

spotify:
  # Debe coincidir EXACTAMENTE con el Redirect URI registrado en el dashboard de Spotify.
  # Spotify no admite "localhost": usa la IP de loopback explícita.
  redirect_uri: http://127.0.0.1:8888/callback

# Avisos por correo (caducidad del login, pérdida de acceso). Sin esta sección,
# los avisos solo aparecen en el log. La contraseña va en .env (SMTP_PASSWORD).
# Ejemplo para Gmail; con otro proveedor cambia servidor y puerto.
email:
  smtp_host: smtp.gmail.com
  smtp_port: 587
  security: starttls      # starttls (puerto 587) o ssl (puerto 465)
  username: tu-cuenta@gmail.com
  to_addr: tu-cuenta@gmail.com
  # from_addr: opcional, por defecto igual que username

# Cada cuánto se consulta Spotify. Más corto detecta mejor los skips rápidos, pero gasta más
# cuota de Development Mode (se cuenta por cuenta de desarrollador y no tiene cifras públicas).
polling:
  playing_interval_s: 3              # mientras suena música
  idle_interval_s: 30                # sin nada sonando o en pausa
  recently_played_interval_min: 60   # sincronización del historial reciente

# F2: límite diario de escuchas por canción. Cuenta como escucha lo que llega al 50 % de la
# canción o a 4 min, y lo que solo registra recently-played. Con dry_run: true solo registra
# "habría saltado" (tabla daily_limit_events) y avisa; no toca el reproductor.
daily_limit:
  dry_run: true
  max_plays: 3
  day_starts_at: "04:00"   # entre comillas: sin ellas YAML lo lee como un número
  skip_after_s: 5          # segundos que tiene que sonar antes de saltarla
  overrides: {}            # límites propios por canción (ID o enlace de Spotify, entre comillas):
  # overrides:
  #   "https://open.spotify.com/track/4uLU6hMCjMI75M1A2tKUQC": 5
