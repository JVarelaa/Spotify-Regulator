services:
  regulator:
    build: .
    image: spotify-regulator:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      - ./config.yaml:/config/config.yaml:ro
    # Sin puertos publicados: el callback OAuth solo se expone durante el login,
    # con `docker compose run -p 127.0.0.1:8888:8888 ...` (ver README).

  # Estadísticas (F4): solo lectura, en http://<IP del homelab>:8080 desde tu red.
  # No abras este puerto en el router: la web no tiene login.
  web:
    build: .
    image: spotify-regulator:latest
    command: ["web", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./config.yaml:/config/config.yaml:ro
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 2
