[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify-regulator"
version = "0.1.0"
description = "Servicio personal que regula hábitos de escucha en Spotify."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
regulator = "regulator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
